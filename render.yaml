databases:
  - name: marketing-hub-db
    databaseName: marketing_hub
    user: marketing_hub
    plan: free

services:
  - type: web
    name: marketing-hub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-hub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "false"
