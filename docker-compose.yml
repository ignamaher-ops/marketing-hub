services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketing_hub
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: marketing
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    depends_on: [db]
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://marketing:marketing@db:5432/marketing_hub
      SESSION_SECRET: local-development-secret-change-me
      SEED_DEMO: "true"
    ports: ["3000:3000"]
volumes:
  pgdata:
