<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= CSS ================= */
:root{
  --ink-900:#14152B; --ink-700:#3A3B57; --ink-500:#6B6C86; --ink-300:#A6A7BC; --ink-100:#E7E7F0;
  --bg:#F5F5FB; --surface:#FFFFFF; --border:#E4E4F0;
  --violet:#5B4CF5; --violet-dark:#4636D6; --violet-tint:#EFEDFF;
  --green:#1E9E6B; --green-tint:#E6F7F0;
  --red:#E0454B; --red-tint:#FDEAEB;
  --amber:#D98A1F; --amber-tint:#FCF1DF;
  --radius-lg:16px; --radius-md:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,21,43,.04), 0 6px 20px -8px rgba(20,21,43,.10);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink-900);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;}
button{cursor:pointer;}
a{text-decoration:none;color:inherit;}
.hidden{display:none!important;}
.app{min-height:100vh;display:flex;}
.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:#fff;border-right:1px solid var(--border);padding:22px 14px;z-index:30;display:flex;flex-direction:column;}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 26px;font-family:Sora,sans-serif;font-weight:800;font-size:19px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--violet);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 8px 18px rgba(91,76,245,.25);}
.brand span{color:var(--violet);}
.nav{display:flex;flex-direction:column;gap:4px;}
.nav button{border:0;background:transparent;color:var(--ink-500);padding:11px 12px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:11px;font-size:14px;font-weight:600;}
.nav button:hover{background:var(--bg);color:var(--ink-900);}
.nav button.active{background:var(--violet-tint);color:var(--violet);}
.nav-icon{width:20px;text-align:center;font-size:16px;}
.sidebar-bottom{margin-top:auto;display:grid;gap:8px;}
.sidebar-bottom button{border:1px solid var(--border);background:#fff;color:var(--ink-700);padding:10px 12px;border-radius:10px;text-align:left;font-weight:600;}
.main{margin-left:248px;width:calc(100% - 248px);min-height:100vh;}
.topbar{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;}
.search-wrap{position:relative;width:min(440px,45vw);}
.search-wrap input{width:100%;border:1px solid var(--border);background:var(--bg);padding:10px 14px 10px 40px;border-radius:10px;outline:none;color:var(--ink-900);}
.search-wrap input:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-tint);}
.search-icon{position:absolute;left:14px;top:10px;color:var(--ink-500);}
.top-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{border:1px solid var(--border);background:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-700);position:relative;}
.dot{position:absolute;right:7px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--red);}
.business-chip{display:flex;align-items:center;gap:9px;margin-left:6px;padding-left:14px;border-left:1px solid var(--border);font-size:13px;font-weight:700;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--violet-tint);color:var(--violet);display:grid;place-items:center;font-weight:800;}
.container{max-width:1450px;margin:0 auto;padding:28px;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px;}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--violet);font-weight:800;margin-bottom:7px;}
h1,h2,h3{font-family:Sora,sans-serif;}
h1{font-size:28px;line-height:1.15;}
h2{font-size:18px;}
h3{font-size:15px;}
.subtitle{color:var(--ink-500);font-size:13px;margin-top:7px;line-height:1.5;}
.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;}
.btn.primary{background:var(--violet);color:#fff;box-shadow:0 8px 18px rgba(91,76,245,.18);}
.btn.primary:hover{background:var(--violet-dark);}
.btn.secondary{background:#fff;color:var(--ink-700);border:1px solid var(--border);}
.btn.danger{background:var(--red-tint);color:var(--red);}
.btn.success{background:var(--green-tint);color:var(--green);}
.grid{display:grid;gap:16px;}
.grid.kpis{grid-template-columns:repeat(4,minmax(0,1fr));}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr));}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr));}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:19px;box-shadow:var(--shadow);}
.kpi{min-height:128px;display:flex;flex-direction:column;justify-content:space-between;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--ink-500);font-size:12px;font-weight:700;}
.kpi-icon{width:35px;height:35px;border-radius:10px;background:var(--violet-tint);color:var(--violet);display:grid;place-items:center;}
.kpi-value{font-family:Sora,sans-serif;font-size:26px;font-weight:800;margin-top:8px;}
.kpi-foot{font-size:12px;color:var(--green);font-weight:700;}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.section-title p{font-size:12px;color:var(--ink-500);}
.chart-card{min-height:335px;}
.chart-box{height:260px;position:relative;}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;}
table{width:100%;border-collapse:collapse;min-width:760px;}
th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap;}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);background:#FAFAFD;}
tr:last-child td{border-bottom:0;}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;}
.badge.success{background:var(--green-tint);color:var(--green);}
.badge.warning{background:var(--amber-tint);color:var(--amber);}
.badge.danger{background:var(--red-tint);color:var(--red);}
.badge.neutral{background:var(--bg);color:var(--ink-500);}
.progress{height:7px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:9px;}
.progress>span{height:100%;display:block;border-radius:inherit;background:var(--violet);}
.list{display:grid;gap:10px;}
.list-item{border:1px solid var(--border);border-radius:12px;padding:13px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.list-main{min-width:0;}
.list-main strong{font-size:13px;display:block;margin-bottom:5px;}
.list-main small{font-size:11px;color:var(--ink-500);line-height:1.45;}
.empty{padding:30px;text-align:center;color:var(--ink-500);font-size:13px;}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;}
.field{display:grid;gap:6px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px;font-weight:800;color:var(--ink-700);}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:9px;padding:10px 11px;outline:none;background:#fff;color:var(--ink-900);}
.field textarea{min-height:100px;resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-tint);}
.modal-overlay{position:fixed;inset:0;background:rgba(20,21,43,.38);display:none;align-items:center;justify-content:center;padding:20px;z-index:80;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;border:1px solid var(--border);box-shadow:0 25px 80px rgba(20,21,43,.25);}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.close-x{border:0;background:var(--bg);width:34px;height:34px;border-radius:9px;color:var(--ink-700);}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.search-results{position:absolute;top:47px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:90;}
.sr-group{padding:9px 12px 6px;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--ink-500);background:#FAFAFD;}
.sr-item{padding:10px 12px;font-size:12px;cursor:pointer;border-top:1px solid var(--border);}
.sr-item:hover{background:var(--violet-tint);}
.search-empty{padding:16px;color:var(--ink-500);font-size:12px;}
.alert{border:1px solid var(--border);border-radius:12px;padding:13px;display:flex;gap:10px;align-items:flex-start;}
.alert strong{font-size:12px;display:block;margin-bottom:4px;}
.alert p{font-size:11px;color:var(--ink-500);line-height:1.45;}
.integration{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border:1px solid var(--border);border-radius:13px;background:#fff;}
.integration + .integration{margin-top:10px;}
.integration-info{display:flex;align-items:center;gap:12px;}
.integration-logo{width:40px;height:40px;border-radius:11px;background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--violet);}
.integration h3{font-size:13px;margin-bottom:4px;}
.integration p{font-size:11px;color:var(--ink-500);}
.connection{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px;background:var(--green-tint);color:var(--green);}
.connection.off{background:var(--bg);color:var(--ink-500);}
.mobile-menu{display:none;}
.ai-box{background:linear-gradient(135deg,#F4F1FF,#fff);border-color:#DDD8FF;}
.ai-box .btn{margin-top:12px;}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.calendar-head{padding:8px;font-size:10px;font-weight:800;text-align:center;background:#FAFAFD;color:var(--ink-500);border-right:1px solid var(--border);}
.calendar-day{min-height:92px;padding:8px;border-top:1px solid var(--border);border-right:1px solid var(--border);font-size:11px;}
.calendar-day:nth-child(7n){border-right:0;}
.day-num{font-weight:800;color:var(--ink-700);margin-bottom:7px;}
.event{font-size:9px;background:var(--violet-tint);color:var(--violet);padding:4px 5px;border-radius:6px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@media(max-width:1050px){.grid.kpis{grid-template-columns:repeat(2,minmax(0,1fr));}.grid.three{grid-template-columns:1fr 1fr;}}
@media(max-width:820px){.sidebar{transform:translateX(-100%);transition:.2s;width:270px;box-shadow:0 0 0 100vmax rgba(0,0,0,0);}.sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vmax rgba(20,21,43,.3);}.main{margin-left:0;width:100%;}.mobile-menu{display:grid;}.topbar{padding:0 14px;}.search-wrap{width:min(55vw,320px);}.business-chip{display:none;}.container{padding:18px 14px;}.grid.two,.grid.three{grid-template-columns:1fr;}.page-head{align-items:flex-start;}.form-grid{grid-template-columns:1fr;}.field.full{grid-column:auto;}}
@media(max-width:560px){.grid.kpis{grid-template-columns:1fr 1fr;gap:10px;}.kpi{min-height:112px;padding:14px;}.kpi-value{font-size:20px;}h1{font-size:23px;}.topbar{height:62px;}.search-wrap{width:calc(100vw - 125px);}.top-actions{gap:6px;}.icon-btn{width:36px;height:36px;}.actions{width:100%;justify-content:flex-start;}.page-head{display:block}.page-head .actions{margin-top:14px;}.calendar-day{min-height:74px;padding:5px;}.event{font-size:8px;}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">M</div><div>Marketing<span>Hub</span></div></div>
    <nav class="nav" id="nav">
      <button data-page="dashboard" class="active"><span class="nav-icon">▦</span>Dashboard</button>
      <button data-page="ads"><span class="nav-icon">↗</span>Publicidad</button>
      <button data-page="content"><span class="nav-icon">▤</span>Contenido</button>
      <button data-page="customers"><span class="nav-icon">♙</span>Clientes</button>
      <button data-page="reviews"><span class="nav-icon">★</span>Reseñas</button>
      <button data-page="promos"><span class="nav-icon">◇</span>Promociones</button>
      <button data-page="analytics"><span class="nav-icon">◒</span>Analytics</button>
      <button data-page="tasks"><span class="nav-icon">✓</span>Tareas</button>
      <button data-page="reports"><span class="nav-icon">▥</span>Reportes</button>
      <button data-page="settings"><span class="nav-icon">⚙</span>Configuración</button>
    </nav>
    <div class="sidebar-bottom">
      <button id="demo-reset">↻ Reiniciar demo</button>
      <button id="logout">⇥ Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-menu" id="mobile-menu">☰</button>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="global-search" placeholder="Buscar campañas, clientes, contenido..." autocomplete="off">
        <div class="search-results hidden" id="search-results"></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="notification-btn" title="Notificaciones">♧<span class="dot hidden" id="notification-dot"></span></button>
        <div class="business-chip"><div class="avatar" id="avatar">MH</div><span id="business-name-top">Mi negocio</span></div>
      </div>
    </header>

    <div class="container" id="view"></div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-box"></div></div>

<script>
/* ================= DEMO DATA ================= */
function cid(){ return 'id-' + Math.random().toString(36).slice(2,10); }
function buildDemoData(){
  return {
    business:{name:'La Esquina',category:'Restaurante',budget:150000,address:'Av. Corrientes 1234, CABA',phone:'+54 11 4567-8900',instagram:'@laesquina',whatsapp:'+54 9 11 5555-5555'},
    campaigns:[
      {id:cid(),name:'Instagram — Promo 2x1',platform:'Instagram',objective:'Ventas',budget:80000,spent:62400,sales:73,queries:186,status:'Activa'},
      {id:cid(),name:'Meta — Alcance local',platform:'Facebook',objective:'Alcance',budget:45000,spent:31400,sales:21,queries:94,status:'Activa'},
      {id:cid(),name:'Google — Restaurante CABA',platform:'Google',objective:'Consultas',budget:35000,spent:28400,sales:29,queries:112,status:'Activa'}
    ],
    content:[
      {id:cid(),title:'Promo 2x1 de viernes',date:'2026-09-05',platform:'Instagram',format:'Post',status:'Programado'},
      {id:cid(),title:'Behind the scenes de cocina',date:'2026-09-06',platform:'Instagram',format:'Reel',status:'Borrador'},
      {id:cid(),title:'Menú de la semana',date:'2026-09-07',platform:'WhatsApp',format:'Mensaje',status:'Publicado'},
      {id:cid(),title:'Historia: reservá tu mesa',date:'2026-09-08',platform:'Instagram',format:'Story',status:'Programado'}
    ],
    customers:[
      {id:cid(),name:'Sofía Martínez',phone:'+54 9 11 5555-1111',email:'sofia@mail.com',status:'Activo',last:'2026-09-03'},
      {id:cid(),name:'Tomás Pérez',phone:'+54 9 11 5555-2222',email:'tomas@mail.com',status:'Activo',last:'2026-08-29'},
      {id:cid(),name:'Lucía Gómez',phone:'+54 9 11 5555-3333',email:'lucia@mail.com',status:'Inactivo',last:'2026-07-15'},
      {id:cid(),name:'Martín Rossi',phone:'+54 9 11 5555-4444',email:'martin@mail.com',status:'Activo',last:'2026-09-01'}
    ],
    reviews:[
      {id:cid(),name:'Carla',rating:5,comment:'Excelente comida y atención. Volvería sin dudas.',date:'2026-09-03',status:'Sin responder',reply:''},
      {id:cid(),name:'Nico',rating:4,comment:'Muy buena experiencia, quizás un poco lento el servicio.',date:'2026-09-02',status:'Sin responder',reply:''},
      {id:cid(),name:'Bruno Ibarra',rating:4,comment:'Muy buena onda del personal, un poco caro.',date:'2026-08-20',status:'Sin responder',reply:''}
    ],
    promotions:[
      {id:cid(),name:'Bienvenida clientes nuevos',code:'BIENVENIDO20',discount:'20%',start:'2026-09-01',end:'2026-09-30',uses:64,status:'Activa'},
      {id:cid(),name:'Viernes de pizza',code:'VIERNES2X1',discount:'2x1',start:'2026-09-01',end:'2026-09-30',uses:41,status:'Activa'},
      {id:cid(),name:'Cyber semana',code:'CYBER15',discount:'15%',start:'2026-07-01',end:'2026-07-10',uses:120,status:'Finalizada'}
    ],
    tasks:[
      {id:cid(),title:'Responder reseñas pendientes',description:'Contestar las 3 reseñas más recientes sin respuesta.',priority:'Alta',date:'2026-09-04',status:'Pendiente'},
      {id:cid(),title:'Crear contenido para el viernes',description:'Post + story anunciando la promo 2x1.',priority:'Alta',date:'2026-09-05',status:'En progreso'},
      {id:cid(),title:'Revisar campaña de Instagram',description:'Analizar performance de la semana y ajustar presupuesto.',priority:'Media',date:'2026-09-06',status:'Pendiente'},
      {id:cid(),title:'Contactar clientes inactivos',description:'Enviar WhatsApp con promo especial a clientes inactivos.',priority:'Media',date:'2026-09-07',status:'Pendiente'},
      {id:cid(),title:'Preparar promoción del fin de semana',description:'Definir descuento y piezas gráficas.',priority:'Baja',date:'2026-09-08',status:'Completada'}
    ],
    notifications:[
      {id:cid(),text:'Tenés 3 reseñas pendientes.',time:'Hace 2h'},
      {id:cid(),text:'Tu campaña de Instagram está funcionando muy bien.',time:'Hace 5h'},
      {id:cid(),text:'Tu presupuesto mensual está cerca del límite.',time:'Ayer'},
      {id:cid(),text:'Tenés contenido programado para mañana.',time:'Ayer'}
    ],
    meta:{monthLabel:'Septiembre 2026'}
  };
}
let DB=null;
function loadDB(){
  try{ const raw=localStorage.getItem('mh_data'); DB=raw?JSON.parse(raw):buildDemoData(); if(!raw)saveDB(); }
  catch(e){DB=buildDemoData();saveDB();}
}
function saveDB(){localStorage.setItem('mh_data',JSON.stringify(DB));}
function resetDB(){DB=buildDemoData();saveDB();render();}
let currentPage='dashboard';
let dashboardPeriod='Este mes';
let analyticsPeriod='Este mes';
let chartRefs={};
function destroyChart(key){if(chartRefs[key]){chartRefs[key].destroy();delete chartRefs[key];}}
function money(n){return '$'+Math.round(n).toLocaleString('es-AR');}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function initials(name){return name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();}
function statusBadge(status){
  const map={Activa:'success',Publicado:'success',Completada:'success','En progreso':'warning',Programado:'warning',Pendiente:'danger','Sin responder':'danger',Borrador:'neutral',Inactivo:'neutral',Finalizada:'neutral'};
  return `<span class="badge ${map[status]||'neutral'}">${esc(status)}</span>`;
}
function priorityBadge(p){return `<span class="badge ${p==='Alta'?'danger':p==='Media'?'warning':'neutral'}">${esc(p)}</span>`;}
function layout(content){
  document.getElementById('view').innerHTML=content;
  document.getElementById('business-name-top').textContent=DB.business.name;
  document.getElementById('avatar').textContent=initials(DB.business.name);
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));
  const pending=DB.reviews.filter(x=>x.status==='Sin responder').length+DB.tasks.filter(x=>x.status!=='Completada').length;
  document.getElementById('notification-dot').classList.toggle('hidden',pending===0);
  window.scrollTo({top:0,behavior:'instant'});
}
function navigate(page){currentPage=page;document.getElementById('sidebar').classList.remove('open');render();}
function openModal(title,body,foot=''){
  const box=document.getElementById('modal-box');
  box.innerHTML=`<div class="modal-head"><h3>${title}</h3><button class="close-x" id="modal-close">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}`;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-close').onclick=closeModal;
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function pageHead(kicker,title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><div class="subtitle">${sub}</div></div><div class="actions">${actions}</div></div>`;}

/* ================= DASHBOARD ================= */
function dashboard(){
  const spend=DB.campaigns.reduce((a,c)=>a+c.spent,0), sales=DB.campaigns.reduce((a,c)=>a+c.sales,0), queries=DB.campaigns.reduce((a,c)=>a+c.queries,0);
  const roas=(sales*42/spend).toFixed(1), cps=(spend/sales).toFixed(0);

function taskModal(){openModal('Nueva tarea',`<form id="task-form"><div class="form-grid"><div class="field full"><label>Título</label><input name="title" required></div><div class="field full"><label>Descripción</label><textarea name="description"></textarea></div><div class="field"><label>Prioridad</label><select name="priority"><option>Alta</option><option>Media</option><option>Baja</option></select></div><div class="field"><label>Fecha</label><input name="date" type="date" required></div></div></form>`,`<button class="btn secondary" id="cancel-modal">Cancelar</button><button class="btn primary" id="save-task">Guardar</button>`);document.getElementById('cancel-modal').onclick=closeModal;document.getElementById('save-task').onclick=()=>{const f=new FormData(document.getElementById('task-form'));DB.tasks.push({id:cid(),title:f.get('title'),description:f.get('description'),priority:f.get('priority'),date:f.get('date'),status:'Pendiente'});saveDB();closeModal();render();};}

/* ================= REPORTS ================= */
function reports(){return pageHead('Reporting','Reportes','Exportá una foto del estado de tu marketing.',`<button class="btn primary" id="export-csv">Exportar CSV</button><button class="btn secondary" id="print-report">Imprimir</button>`)+`<div class="grid two"><div class="card"><h2>Resumen ejecutivo</h2><p class="subtitle">Período: ${DB.meta.monthLabel}</p><div class="list" style="margin-top:14px"><div class="list-item"><div class="list-main"><strong>Inversión</strong><small>Gasto publicitario acumulado</small></div><b>${money(DB.campaigns.reduce((a,c)=>a+c.spent,0))}</b></div><div class="list-item"><div class="list-main"><strong>Ventas</strong><small>Ventas atribuidas a campañas</small></div><b>${DB.campaigns.reduce((a,c)=>a+c.sales,0)}</b></div><div class="list-item"><div class="list-main"><strong>Consultas</strong><small>Consultas generadas</small></div><b>${DB.campaigns.reduce((a,c)=>a+c.queries,0)}</b></div></div></div><div class="card ai-box"><h2>Reporte para cliente</h2><p class="subtitle">En una versión productiva, este módulo puede generar automáticamente un PDF mensual con resultados, explicación y próximos pasos.</p><button class="btn primary" id="report-ai">Generar resumen</button></div></div><div style="height:16px"></div><div class="card"><h2>Campañas</h2><div style="height:12px"></div>${campaignTable()}</div>`;}
function exportCSV(){const rows=[['Campaña','Plataforma','Objetivo','Presupuesto','Gastado','Consultas','Ventas','Estado'],...DB.campaigns.map(c=>[c.name,c.platform,c.objective,c.budget,c.spent,c.queries,c.sales,c.status])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='marketing-hub-reporte.csv';a.click();URL.revokeObjectURL(a.href);}

/* ================= SETTINGS ================= */
function settings(){return pageHead('Workspace','Configuración','Personalizá el negocio y prepará futuras conexiones.')+`<div class="grid two"><div class="card"><div class="section-title"><div><h2>Datos del negocio</h2><p>Se guardan localmente en esta demo.</p></div></div><form id="settings-form"><div class="form-grid"><div class="field"><label>Nombre</label><input name="name" value="${esc(DB.business.name)}"></div><div class="field"><label>Categoría</label><input name="category" value="${esc(DB.business.category)}"></div><div class="field"><label>Presupuesto mensual</label><input name="budget" type="number" value="${DB.business.budget}"></div><div class="field"><label>Teléfono</label><input name="phone" value="${esc(DB.business.phone)}"></div><div class="field full"><label>Dirección</label><input name="address" value="${esc(DB.business.address)}"></div><div class="field"><label>Instagram</label><input name="instagram" value="${esc(DB.business.instagram)}"></div><div class="field"><label>WhatsApp</label><input name="whatsapp" value="${esc(DB.business.whatsapp)}"></div></div><button class="btn primary" style="margin-top:15px" id="save-settings">Guardar cambios</button></form></div><div class="card"><div class="section-title"><div><h2>Conexiones</h2><p>Arquitectura preparada para integraciones reales.</p></div></div>${integration('Google Business Profile','Reseñas, perfil y presencia local','CONECTADO · DEMO','GB')}${integration('Meta Ads','Campañas, gasto y conversiones','CONECTADO · DEMO','M')}${integration('Google Ads','Campañas y conversiones','NO CONECTADO','G')}${integration('Instagram / Facebook','Contenido y métricas','NO CONECTADO','IG')}${integration('WhatsApp Business','Mensajes y atención','NO CONECTADO','W')}${integration('POS / E-commerce','Ventas y clientes reales','NO CONECTADO','POS')}<div class="alert" style="margin-top:14px"><div>🔒</div><div><strong>Arquitectura recomendada</strong><p>Frontend → Backend seguro → Base de datos + APIs + IA. Los tokens nunca deben vivir en este HTML.</p></div></div></div></div>`;}
function integration(name,desc,status,logo){return `<div class="integration"><div class="integration-info"><div class="integration-logo">${logo}</div><div><h3>${name}</h3><p>${desc}</p></div></div><div style="display:flex;align-items:center;gap:8px"><span class="connection ${status.startsWith('NO')?'off':''}">${status}</span><button class="btn secondary" data-connect="${esc(name)}">${status.startsWith('NO')?'Conectar':'Sincronizar'}</button></div></div>`;}

/* ================= NOTIFICATIONS / SEARCH ================= */
function notifications(){openModal('Notificaciones',`<div class="list">${DB.notifications.map(n=>`<div class="list-item"><div class="list-main"><strong>${esc(n.text)}</strong><small>${esc(n.time)}</small></div></div>`).join('')}</div>`,'<button class="btn secondary" id="cancel-modal">Cerrar</button>');document.getElementById('cancel-modal').onclick=closeModal;}
function globalSearch(q){const box=document.getElementById('search-results');if(!q.trim()){box.classList.add('hidden');return;}const groups=[['Campañas',DB.campaigns.filter(x=>x.name.toLowerCase().includes(q.toLowerCase())), 'ads',x=>x.name],['Clientes',DB.customers.filter(x=>x.name.toLowerCase().includes(q.toLowerCase())), 'customers',x=>x.name],['Contenido',DB.content.filter(x=>x.title.toLowerCase().includes(q.toLowerCase())), 'content',x=>x.title],['Promociones',DB.promotions.filter(x=>x.name.toLowerCase().includes(q.toLowerCase())||x.code.toLowerCase().includes(q.toLowerCase())), 'promos',x=>x.name],['Tareas',DB.tasks.filter(x=>x.title.toLowerCase().includes(q.toLowerCase())), 'tasks',x=>x.title]];let html='';groups.forEach(([label,arr,page,get])=>{if(arr.length){html+=`<div class="sr-group">${label}</div>`;arr.slice(0,4).forEach(item=>html+=`<div class="sr-item" data-page="${page}">${esc(get(item))} →</div>`);}});if(!html)html='<div class="search-empty">Sin resultados.</div>';box.innerHTML=html;box.classList.remove('hidden');box.querySelectorAll('.sr-item').forEach(x=>x.onclick=()=>{navigate(x.dataset.page);box.classList.add('hidden');document.getElementById('global-search').value='';});}

/* ================= EVENT BINDING ================= */
function bind(){
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
  document.getElementById('mobile-menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('notification-btn').onclick=notifications;
  document.getElementById('global-search').oninput=e=>globalSearch(e.target.value);
  document.getElementById('demo-reset').onclick=()=>{if(confirm('¿Reiniciar todos los datos demo?'))resetDB();};
  document.getElementById('logout').onclick=()=>alert('En esta versión demo la sesión es local. En producción se conectará a autenticación real.');
  const q=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn;};
  q('quick-campaign',()=>campaignModal());q('new-campaign',()=>campaignModal());q('new-content',contentModal);q('content-ai',contentGenerator);q('new-customer',customerModal);q('new-promo',promoModal);q('new-task',taskModal);q('export-csv',exportCSV);q('print-report',()=>window.print());q('ai-campaign',()=>openModal('Idea de campaña','<div class="card ai-box"><h3>“Viernes de mesa completa”</h3><p class="subtitle">Campaña local de 5 días: video corto del plato estrella + prueba social + CTA a WhatsApp. Segmento: personas de 2–5 km alrededor del local.</p><div style="height:12px"></div><b>Oferta:</b> 2x1 en el segundo plato los viernes.<br><br><b>CTA:</b> Reservá antes de las 19:00.</div>','<button class="btn secondary" id="cancel-modal">Cerrar</button>'));q('go-tasks',()=>navigate('tasks'));q('review-ai',()=>alert('En producción, esta acción llamará a un modelo de IA para generar respuestas con contexto de cada reseña.'));q('report-ai',()=>alert('En producción, este módulo puede generar automáticamente un reporte mensual con explicación de resultados y próximos pasos.'));
  q('save-settings',e=>{e.preventDefault();const f=new FormData(document.getElementById('settings-form'));Object.assign(DB.business,{name:f.get('name'),category:f.get('category'),budget:Number(f.get('budget')),phone:f.get('phone'),address:f.get('address'),instagram:f.get('instagram'),whatsapp:f.get('whatsapp')});saveDB();render();});
  const dp=document.getElementById('dashboard-period');if(dp)dp.onchange=e=>{dashboardPeriod=e.target.value;render();};
  const ap=document.getElementById('analytics-period');if(ap)ap.onchange=e=>{analyticsPeriod=e.target.value;render();};
  document.querySelectorAll('[data-edit-campaign]').forEach(x=>x.onclick=()=>campaignModal(x.dataset.editCampaign));
  document.querySelectorAll('[data-delete-campaign]').forEach(x=>x.onclick=()=>{DB.campaigns=DB.campaigns.filter(c=>c.id!==x.dataset.deleteCampaign);saveDB();render();});
  document.querySelectorAll('[data-delete-content]').forEach(x=>x.onclick=()=>{DB.content=DB.content.filter(c=>c.id!==x.dataset.deleteContent);saveDB();render();});
  document.querySelectorAll('[data-contact]').forEach(x=>x.onclick=()=>{const c=DB.customers.find(c=>c.id===x.dataset.contact);alert(`Contacto demo: ${c.name}\nWhatsApp: ${c.phone}`);});
  document.querySelectorAll('[data-review]').forEach(x=>x.onclick=()=>reviewModal(x.dataset.review));
  document.querySelectorAll('[data-delete-promo]').forEach(x=>x.onclick=()=>{DB.promotions=DB.promotions.filter(p=>p.id!==x.dataset.deletePromo);saveDB();render();});
  document.querySelectorAll('[data-copy-promo]').forEach(x=>x.onclick=async()=>{try{await navigator.clipboard.writeText(x.dataset.copyPromo);alert('Código copiado: '+x.dataset.copyPromo);}catch(e){alert('Código: '+x.dataset.copyPromo);}});
  document.querySelectorAll('[data-toggle-task]').forEach(x=>x.onclick=()=>{const t=DB.tasks.find(t=>t.id===x.dataset.toggleTask);t.status=t.status==='Completada'?'Pendiente':'Completada';saveDB();render();});
  document.querySelectorAll('[data-connect]').forEach(x=>x.onclick=()=>alert(`${x.dataset.connect}: en producción se abrirá OAuth y la conexión segura pasará por el backend.`));
}
function render(){
  loadDB();
  let html='';
  if(currentPage==='dashboard')html=dashboard();
  else if(currentPage==='ads')html=ads();
  else if(currentPage==='content')html=content();
  else if(currentPage==='customers')html=customers();
  else if(currentPage==='reviews')html=reviews();
  else if(currentPage==='promos')html=promos();
  else if(currentPage==='analytics')html=analytics();
  else if(currentPage==='tasks')html=tasks();
  else if(currentPage==='reports')html=reports();
  else if(currentPage==='settings')html=settings();
  layout(html);bind();
  if(currentPage==='dashboard')renderDashboardCharts();
  if(currentPage==='analytics')renderAnalyticsCharts();
}

document.getElementById('modal-overlay').onclick=e=>{if(e.target.id==='modal-overlay')closeModal();};
render();
</script>
</body>
</html>
